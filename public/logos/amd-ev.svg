<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="240" height="120">
  <rect width="240" height="120" rx="8" fill="#1a3a6b"/>
  <!-- Caduceus / medical cross -->
  <g transform="translate(30, 20)">
    <!-- Cross -->
    <rect x="26" y="6" width="8" height="28" fill="#ffffff" rx="2"/>
    <rect x="18" y="14" width="24" height="8" fill="#ffffff" rx="2"/>
    <!-- Small circle top -->
    <circle cx="30" cy="4" r="4" fill="#D4AF37"/>
  </g>
  <!-- Text -->
  <text x="82" y="52" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="1">AMD</text>
  <text x="82" y="72" font-family="Georgia, serif" font-size="14" fill="#D4AF37" letter-spacing="2">e.V.</text>
  <text x="30" y="98" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" letter-spacing="0.5">Aserbaidschanische Mediziner</text>
  <text x="30" y="110" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" letter-spacing="0.5">in Deutschland e.V.</text>
</svg>
